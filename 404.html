<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Сторінку не знайдено | Україна — Шотландія — Україна</title>
  <meta name="description" content="Сторінку не знайдено. Поверніться на головну сторінку перевезень Україна — Шотландія — Україна або зв'яжіться з нами.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="404.css">
</head>
<body class="error-page">
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo" aria-label="На головну">
        <span class="logo-ua">UA</span><span class="logo-divider">—</span><span class="logo-sc">SC</span>
      </a>
      <button class="burger" id="burger" aria-label="Відкрити меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="header__nav" id="nav" aria-label="Головна навігація">
        <a href="index.html#dates" class="nav-link">Дати</a>
        <a href="index.html#services" class="nav-link">Послуги</a>
        <a href="index.html#route" class="nav-link">Маршрут</a>
        <a href="index.html#pricing" class="nav-link">Ціни</a>
        <a href="index.html#contacts" class="nav-link">Контакти</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="not-found" aria-labelledby="not-found-title">
      <div class="not-found__decor" aria-hidden="true"></div>
      <div class="container not-found__inner">
        <div class="not-found__content">
          <h1 class="not-found__title" id="not-found-title">404</h1>
          <p class="not-found__subtitle">
            Схоже, ця сторінка звернула не туди. Ми повернемо вас на правильний маршрут між Україною та Великобританією.
          </p>
          <div class="not-found__actions">
            <a href="index.html" class="btn btn--primary">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M9 21V9h6v12"/></svg>
              На головну
            </a>
            <a href="index.html#contact-form" class="btn btn--secondary">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 01-4 4H7l-4 4V7a4 4 0 014-4h10a4 4 0 014 4z"/></svg>
              Залишити заявку
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">&copy; 2025 Україна — Шотландія. Перевезення та доставка посилок.</p>
      <div class="footer__cta">
        <a href="index.html#contacts" class="btn btn--small btn--primary">Контакти</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var burger = document.getElementById('burger');
      var nav = document.getElementById('nav');
      if (!burger || !nav) return;
      burger.addEventListener('click', function () {
        var isOpen = nav.classList.toggle('open');
        burger.classList.toggle('active');
        burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
      nav.querySelectorAll('.nav-link').forEach(function (link) {
        link.addEventListener('click', function () {
          nav.classList.remove('open');
          burger.classList.remove('active');
          burger.setAttribute('aria-expanded', 'false');
        });
      });
    }());
  </script>
</body>
</html>
